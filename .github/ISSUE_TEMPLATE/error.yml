name: Informe de error
description: Algo no funciona como debería
labels: ["error"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por dedicar el rato. Cuanto más concreto seas, antes se arregla.

  - type: dropdown
    id: donde
    attributes:
      label: ¿Dónde ocurre?
      options:
        - Demo local (LocalStack)
        - Desplegado en AWS
        - Tests
        - Síntesis de CDK
        - Otro
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas que pasara
    validations:
      required: true

  - type: textarea
    id: ocurrido
    attributes:
      label: Qué pasó en realidad
      description: Pega el error completo, no solo la última línea.
      render: shell
    validations:
      required: true

  - type: textarea
    id: reproducir
    attributes:
      label: Cómo reproducirlo
      description: Los comandos exactos, desde un repositorio recién clonado.
      placeholder: |
        1. make install
        2. make up
        3. make demo
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versión de Python
      placeholder: "3.11.9"
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit
      description: Salida de `git rev-parse --short HEAD`
    validations:
      required: true
