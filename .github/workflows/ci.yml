name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  calidad:
    name: Lint y formato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install ruff
      - name: ruff check
        run: ruff check src tests infra local scripts
      - name: ruff format
        run: ruff format --check src tests infra local scripts
      - name: El diagrama esta al dia
        run: |
          python scripts/make_architecture_svg.py
          git diff --exit-code -- docs/ \
            || (echo "::error::El diagrama no coincide con el generador. Ejecuta 'make diagram'." && exit 1)

  tests:
    name: Tests unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: pytest
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=85
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cobertura
          path: coverage.xml

  infraestructura:
    name: Sintesis de CloudFormation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e ".[dev]" -r infra/requirements.txt
      - run: npm install -g aws-cdk
      - name: Empaquetar Lambdas
        run: make package
      - name: Tests de infraestructura
        run: pytest tests/test_infra.py -q
      - name: cdk synth
        working-directory: infra
        env:
          CDK_DEFAULT_ACCOUNT: "111122223333"
          CDK_DEFAULT_REGION: eu-west-1
        run: cdk synth --all
      - uses: actions/upload-artifact@v7
        with:
          name: plantillas-cloudformation
          path: infra/cdk.out/*.template.json

  demo-extremo-a-extremo:
    name: Pipeline completo contra LocalStack
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:3.8
        ports: ["4566:4566"]
        env:
          SERVICES: s3,dynamodb,sns
          AWS_DEFAULT_REGION: eu-west-1
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Crear recursos
        run: python local/bootstrap.py
      - name: Caso correcto (debe terminar VERIFIED)
        run: python local/run_pipeline.py --file sample_data/clientes_ok.csv --wait 2
      - name: Fichero corrupto (debe acabar en cuarentena)
        run: |
          python local/bootstrap.py
          python local/run_pipeline.py --file sample_data/clientes_ko.csv --wait 2 || \
            test $? -eq 2
      - name: Datos sucios (la verificacion A debe detenerlo)
        run: |
          python local/bootstrap.py
          python local/run_pipeline.py --file sample_data/clientes_sucio.csv --wait 2 || \
            test $? -eq 2
      - name: Reproceso entre A y B (debe detectarse la divergencia)
        run: |
          python local/bootstrap.py
          python local/run_pipeline.py --file sample_data/clientes_ok.csv --wait 2 \
            --simulate-drift || test $? -eq 2
