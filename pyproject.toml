[project]
name = "datamap-ingest"
version = "1.0.0"
description = "Pipeline serverless en AWS para ingesta CSV, transformacion con Glue y doble verificacion de calidad de datos"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "moto[s3,dynamodb,sns,stepfunctions]>=5.0",
    "ruff>=0.6",
    "duckdb>=1.0",
    "pandas>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "integration: pruebas que necesitan LocalStack levantado",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Artefactos generados: los assets que CDK copia dentro de cdk.out y el
# paquete de las Lambdas no son codigo de este repositorio.
extend-exclude = ["cdk.out", "build", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src"]
omit = ["src/glue_jobs/*"]
